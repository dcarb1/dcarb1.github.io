<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bouncing Box</title>
    <script src="jquery.min.js"></script>

    <style>
      .box {
        width: 70px;
        height: 70px;
        background-color: teal;
        font-size: 300%;
        text-align: center;
        user-select: none;
        display: block;
        position: absolute;
        top: 100px;
        left: 0px;
      }

      .board {
        height: 100vh;
      }
    </style>
  </head>

  <body class="board">
    <div class="box">?</div>

    <script>
      (function () {
        "use strict";
        /* global jQuery */

        var box = jQuery(".box");
        var board = jQuery(".board");
        var boardWidth = board.width();

        jQuery(window).on("resize", function () {
          boardWidth = board.width();
        });

        setInterval(update, 50);

        box.on("click", handleBoxClick);

        function moveBoxTo(newPositionX) {
          box.css("left", newPositionX);
        }

        function changeBoxText(newText) {
          box.text(newText);
        }

        // TODO 2: Create a positionX variable
        var positionX = 0;

        // TODO 4: Create a points variable
        var points = 0;

        // TODO 5: Create a speed variable
        var speed = 10;

        function update() {
          // TODO 2: Add 10 to positionX
          // TODO 5: Use speed instead of 10
          positionX = positionX + speed;

          // TODO 6: Check if the box goes past the right side
          if (positionX > boardWidth) {
            // TODO 6: Reverse the speed
            speed = speed * -1;
          }

          moveBoxTo(positionX);
        }

        function handleBoxClick() {
       
          positionX = 0;

          // TODO 4: Add 1 point when the box is clicked
          points = points + 1;

          // TODO 5: Make the box faster when clicked
          speed = speed + 3;

          changeBoxText(points);
        }
      })();
    </script>
  </body>
</html>
